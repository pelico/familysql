<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭事件记录与分析系统</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tag-chip {
            display: inline-flex;
            align-items: center;
            background-color: #e2e8f0;
            color: #1a202c;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            margin: 0.25rem;
        }
        .tag-chip button {
            margin-left: 0.375rem;
            color: #4a5568;
            font-weight: bold;
        }
        .tag-chip button:hover {
            color: #e53e3e;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen pb-12">

    <div class="max-w-xl mx-auto px-4 py-8">
        <header class="mb-8 text-center">
            <h1 class="text-2xl font-bold tracking-tight text-gray-900">家庭观察记录</h1>
            <p class="text-xs text-gray-500 mt-1">数据加密本地存储 · 物理层绝不篡改</p>
        </header>

        <!-- 填报表单卡片 -->
        <main class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <form id="eventForm" class="p-6 space-y-5">
                
                <!-- 时间选择 (带重置当前时间按钮) -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">发生时间</label>
                    <div class="flex space-x-2">
                        <input type="datetime-local" id="timestamp" required
                               class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm p-2.5 border">
                        <button type="button" id="setCurrentTime"
                                class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-medium px-3 rounded-lg border border-gray-300 transition">
                            当前
                        </button>
                    </div>
                </div>

                <!-- 涉及人物 (支持新增) -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">涉及人物</label>
                    <div class="space-y-2">
                        <div id="peopleChips" class="flex flex-wrap -m-1"></div>
                        <div class="flex space-x-2">
                            <select id="peopleSelect" class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm p-2.5 border">
                                <option value="">-- 选择已有或输入新增 --</option>
                            </select>
                            <input type="text" id="newPerson" placeholder="输入新人物" 
                                   class="block w-1/3 rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm p-2.5 border">
                            <button type="button" id="addPersonBtn"
                                    class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold px-4 rounded-lg border border-indigo-200 transition text-sm">
                                ＋
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 标签分类 (支持新增) -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">标签分类</label>
                    <div class="space-y-2">
                        <div id="tagsChips" class="flex flex-wrap -m-1"></div>
                        <div class="flex space-x-2">
                            <select id="tagsSelect" class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm p-2.5 border">
                                <option value="">-- 选择已有或输入新增 --</option>
                            </select>
                            <input type="text" id="newTag" placeholder="输入新标签" 
                                   class="block w-1/3 rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm p-2.5 border">
                            <button type="button" id="addTagBtn"
                                    class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold px-4 rounded-lg border border-indigo-200 transition text-sm">
                                ＋
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 严重度滑块 -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-sm font-semibold text-gray-700">严重度级别 (1-5)</label>
                        <span id="severityVal" class="text-sm font-bold text-indigo-600 bg-indigo-50 px-2.5 py-0.5 rounded-full">1 (轻微)</span>
                    </div>
                    <input type="range" id="severity_self" min="1" max="5" value="1" step="1"
                           class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                    <div class="flex justify-between text-[10px] text-gray-400 px-1 mt-1">
                        <span>1: 背景噪音</span>
                        <span>3: 爆发冲突</span>
                        <span>5: 系统重构阈值</span>
                    </div>
                </div>

                <!-- 事件内容 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">事件详情</label>
                    <textarea id="content" rows="4" required placeholder="如实记录具体发生的物理事实、言论及客观场景，不夹杂主观揣测与情绪偏见..."
                              class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm p-2.5 border"></textarea>
                </div>

                <!-- 提示/确认区域 -->
                <div id="messageBox" class="hidden p-3 rounded-lg text-sm text-center"></div>

                <!-- 提交按钮 -->
                <button type="submit" 
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-150 ease-in-out">
                    写入原始档案 (不可撤销)
                </button>
            </form>
        </main>
    </div>

    <!-- 前端交互逻辑 -->
    <script>
        // 状态管理
        const state = {
            selectedPeople: [],
            selectedTags: [],
            availablePeople: [],
            availableTags: []
        };

        const severityLabels = {
            1: "1 (背景噪音)",
            2: "2 (轻度摩擦)",
            3: "3 (中度冲突)",
            4: "4 (重度投毒)",
            5: "5 (系统重构触发)"
        };

        // DOM 元素
        const timestampInput = document.getElementById('timestamp');
        const severityInput = document.getElementById('severity_self');
        const severityVal = document.getElementById('severityVal');
        const form = document.getElementById('eventForm');
        const messageBox = document.getElementById('messageBox');

        // 设置当前本地时间并格式化为 datetime-local 支持的格式
        function setLocalTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            timestampInput.value = `${year}-${month}-${day}T${hours}:${minutes}`;
        }

        // 初始化加载已有的 People 和 Tags 字典
        async function fetchMetadata() {
            try {
                const res = await fetch('/api/metadata');
                const data = await res.json();
                state.availablePeople = data.people || [];
                state.availableTags = data.tags || [];
                renderDropdowns();
            } catch (err) {
                console.error('Failed to fetch metadata', err);
            }
        }

        function renderDropdowns() {
            const pSelect = document.getElementById('peopleSelect');
            const tSelect = document.getElementById('tagsSelect');

            // 渲染 People
            pSelect.innerHTML = '<option value="">-- 选择已有人物 --</option>';
            state.availablePeople.forEach(p => {
                if (!state.selectedPeople.includes(p)) {
                    pSelect.innerHTML += `<option value="${p}">${p}</option>`;
                }
            });

            // 渲染 Tags
            tSelect.innerHTML = '<option value="">-- 选择已有标签 --</option>';
            state.availableTags.forEach(t => {
                if (!state.selectedTags.includes(t)) {
                    tSelect.innerHTML += `<option value="${t}">${t}</option>`;
                }
            });
        }

        function renderChips() {
            const pChips = document.getElementById('peopleChips');
            const tChips = document.getElementById('tagsChips');

            pChips.innerHTML = '';
            state.selectedPeople.forEach(p => {
                pChips.innerHTML += `
                    <span class="tag-chip">
                        ${p}
                        <button type="button" onclick="removePerson('${p}')">&times;</button>
                    </span>
                `;
            });

            tChips.innerHTML = '';
            state.selectedTags.forEach(t => {
                tChips.innerHTML += `
                    <span class="tag-chip bg-indigo-50 text-indigo-800">
                        ${t}
                        <button type="button" onclick="removeTag('${t}')">&times;</button>
                    </span>
                `;
            });

            renderDropdowns();
        }

        // 外部移除函数绑定
        window.removePerson = function(name) {
            state.selectedPeople = state.selectedPeople.filter(p => p !== name);
            renderChips();
        };

        window.removeTag = function(name) {
            state.selectedTags = state.selectedTags.filter(t => t !== name);
            renderChips();
        };

        // 绑定事件
        document.getElementById('setCurrentTime').addEventListener('click', setLocalTime);
        
        severityInput.addEventListener('input', (e) => {
            severityVal.innerText = severityLabels[e.target.value] || e.target.value;
        });

        // 快捷添加人物
        document.getElementById('addPersonBtn').addEventListener('click', () => {
            const input = document.getElementById('newPerson');
            const val = input.value.trim();
            if (val && !state.selectedPeople.includes(val)) {
                state.selectedPeople.push(val);
                if (!state.availablePeople.includes(val)) state.availablePeople.push(val);
                input.value = '';
                renderChips();
            }
        });

        document.getElementById('peopleSelect').addEventListener('change', (e) => {
            const val = e.target.value;
            if (val && !state.selectedPeople.includes(val)) {
                state.selectedPeople.push(val);
                renderChips();
            }
        });

        // 快捷添加标签
        document.getElementById('addTagBtn').addEventListener('click', () => {
            const input = document.getElementById('newTag');
            const val = input.value.trim();
            if (val && !state.selectedTags.includes(val)) {
                state.selectedTags.push(val);
                if (!state.availableTags.includes(val)) state.availableTags.push(val);
                input.value = '';
                renderChips();
            }
        });

        document.getElementById('tagsSelect').addEventListener('change', (e) => {
            const val = e.target.value;
            if (val && !state.selectedTags.includes(val)) {
                state.selectedTags.push(val);
                renderChips();
            }
        });

        // 表单提交
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            messageBox.className = 'hidden';

            const payload = {
                timestamp: timestampInput.value.replace('T', ' '),
                people: state.selectedPeople.join(', '),
                tags: state.selectedTags.join(', '),
                severity_self: parseInt(severityInput.value),
                content: document.getElementById('content').value.trim()
            };

            try {
                const res = await fetch('/api/events', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await res.json();
                if (res.ok) {
                    messageBox.innerText = `写入成功！事件 ID: ${result.id}`;
                    messageBox.className = 'p-3 rounded-lg text-sm text-center bg-green-50 text-green-800 font-medium';
                    
                    // 重置表单
                    document.getElementById('content').value = '';
                    state.selectedPeople = [];
                    state.selectedTags = [];
                    setLocalTime();
                    renderChips();
                } else {
                    throw new Error(result.error || 'Unknown error');
                }
            } catch (err) {
                messageBox.innerText = `提交失败: ${err.message}`;
                messageBox.className = 'p-3 rounded-lg text-sm text-center bg-red-50 text-red-800 font-medium';
            }
        });

        // 启动
        setLocalTime();
        fetchMetadata();
    </script>
</body>
</html>
