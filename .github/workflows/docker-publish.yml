name: Build and Push Docker Image

# 触发条件：推送 main/master 分支、打 v* 标签、手动触发
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========== Job 1: 仅 amd64（5 分钟出镜像，测试用） ==========
  #   - 打 :amd64 固定 tag
  #   - :amd64 永远指向 main 分支上最近一次成功构建的 amd64 镜像
  build-amd64-fast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # 分支 push 才跑；打 tag 时让双架构 job 负责
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  # ========== Job 2: 双架构（amd64 + arm64，15 分钟，正式发布） ==========
  #   - :latest / 分支名 / semver / sha 完整 meta 标签
  #   - 依赖 amd64 先跑完（避免 push :latest 冲突）
  build-and-push:
    runs-on: ubuntu-latest
    needs: build-amd64-fast
    permissions:
      contents: read
      packages: write
    # tag 推送时可以直接跑（上面 fast job 会跳过），主分支 push 需要等 fast
    if: |
      always() &&
      (needs.build-amd64-fast.result == 'success' || needs.build-amd64-fast.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
